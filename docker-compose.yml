# Local development / staging orchestration.
# NOTE: MongoDB Atlas is the database — no local Mongo container.
# Set MONGODB_URI in your .env file pointing to your Atlas cluster.

# Usage:
#   cp torbidd-app/.env.example torbidd-app/.env.local   # fill in real values
#   docker compose up --build

# One-time seed (after app is healthy):
#   docker compose run --rm seed

services:
  gateway:
    image: nginx:1.27-alpine
    container_name: torbidd-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    secrets:
      - public_tls_cert
      - public_tls_key
      - internal_tls_ca
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - frontend

  app:
    build:
      context: ./torbidd-app
      dockerfile: Dockerfile
      target: runner
    container_name: torbidd-app
    restart: unless-stopped
    expose:
      - "3443"
    env_file:
      - path: ./torbidd-app/.env.local
        required: false
      - path: ./torbidd-app/.env
        required: false
      - path: ./.env.local
        required: false
      - path: ./.env
        required: false
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: "--tls-min-v1.2"
      NODE_TLS_REJECT_UNAUTHORIZED: "1"
      NODE_EXTRA_CA_CERTS: /run/secrets/internal_tls_ca
      PORT: "3443"
      INTERNAL_HTTP_PORT: "3000"
      INTERNAL_TLS_CERT_FILE: /run/secrets/internal_tls_cert
      INTERNAL_TLS_KEY_FILE: /run/secrets/internal_tls_key
    secrets:
      - internal_tls_cert
      - internal_tls_key
      - internal_tls_ca
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('https://app:3443/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # Mount GCP service account key as a read-only secret file
    # Update the host path to point at your service account JSON.
    # volumes:
    #   - ./secrets/gcp-service-account.json:/secrets/gcp-sa.json:ro
    # ASVS V15.1.5 & V15.2.5: Sandbox container resources with 1GB RAM cap and CPU limit
    mem_limit: 1024m
    cpus: 2.0
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 256M
    networks:
      - frontend
      - egress

  # Runs `npm run seed` once and exits. Only needed on a fresh Atlas cluster.
  # Usage: docker compose run --rm seed
  seed:
    build:
      context: ./torbidd-app
      dockerfile: Dockerfile
      target: builder           # has node_modules + scripts/
    container_name: torbidd-seed
    command: ["npm", "run", "seed"]
    env_file:
      - path: ./torbidd-app/.env.local
        required: false
      - path: ./torbidd-app/.env
        required: false
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--tls-min-v1.2"
      NODE_TLS_REJECT_UNAUTHORIZED: "1"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - egress
    profiles:
      - seed                    # only runs with: docker compose --profile seed run seed

networks:
  frontend:
    internal: true
    driver: bridge
  egress:
    driver: bridge

secrets:
  public_tls_cert:
    file: ${TLS_CERT_PATH:-./infra/tls/fullchain.pem}
  public_tls_key:
    file: ${TLS_KEY_PATH:-./infra/tls/privkey.pem}
  internal_tls_ca:
    file: ${INTERNAL_TLS_CA_PATH:-./infra/tls/internal-ca.pem}
  internal_tls_cert:
    file: ${INTERNAL_TLS_CERT_PATH:-./infra/tls/internal.crt}
  internal_tls_key:
    file: ${INTERNAL_TLS_KEY_PATH:-./infra/tls/internal.key}
