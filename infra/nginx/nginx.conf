events {
  worker_connections 1024;
}

http {
  server_tokens off;

  log_format main '$remote_addr - $host [$time_local] "$request" $status $body_bytes_sent';
  access_log /var/log/nginx/access.log main;
  error_log /var/log/nginx/error.log warn;

  upstream torbidd_app {
    server app:3443;
    keepalive 32;
  }

  server {
    listen 80;
    listen [::]:80;
    server_name _;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    return 308 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /run/secrets/public_tls_cert;
    ssl_certificate_key /run/secrets/public_tls_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    client_max_body_size 26m;

    location / {
      proxy_pass https://torbidd_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;

      proxy_ssl_server_name on;
      proxy_ssl_name app;
      proxy_ssl_protocols TLSv1.2 TLSv1.3;
      proxy_ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
      proxy_ssl_trusted_certificate /run/secrets/internal_tls_ca;
      proxy_ssl_verify on;
      proxy_ssl_verify_depth 2;
    }
  }
}
